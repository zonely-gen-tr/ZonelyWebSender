<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc"><title id="title">ZonelyWebSender özellikleri</title><desc id="desc">Portsuz kullanım, uzaktan komut, güvenli bağlantı ve kolay kurulum.</desc><rect width="1200" height="405" rx="20" fill="#0b1220"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="61" fill="#fff" font-size="34" font-weight="700">Bağlantı senin seçimin.</text><rect x="32" y="91" width="560" height="139" rx="14" fill="#111e31"/><g data-feather="shield" transform="translate(54 114) scale(1.1666666666666667)" stroke="#60a5fa" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/></g><text x="99" y="138" fill="#f8fafc" font-size="23" font-weight="650">Portsuz kullanım</text><text x="54" y="177" fill="#cbd5e1" font-size="19" font-weight="400">Sunucuna kolayca bağlan.</text><text x="54" y="205" fill="#94a3b8" font-size="19" font-weight="400">Ek bir gelen bağlantı portu açman gerekmez.</text><rect x="604" y="91" width="560" height="139" rx="14" fill="#111e31"/><g data-feather="terminal" transform="translate(626 114) scale(1.1666666666666667)" stroke="#60a5fa" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-5-6-5M12 19h8"/></g><text x="671" y="138" fill="#f8fafc" font-size="23" font-weight="650">Uzaktan komut</text><text x="626" y="177" fill="#cbd5e1" font-size="19" font-weight="400">Sunucuna komut ve mesaj gönder.</text><text x="626" y="205" fill="#94a3b8" font-size="19" font-weight="400">İşlemler sunucu tarafından yürütülür.</text><rect x="32" y="242" width="560" height="139" rx="14" fill="#111e31"/><g data-feather="server" transform="translate(54 265) scale(1.1666666666666667)" stroke="#60a5fa" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></g><text x="99" y="289" fill="#f8fafc" font-size="23" font-weight="650">Güvenli bağlantı</text><text x="54" y="328" fill="#cbd5e1" font-size="19" font-weight="400">Sunucunla güvenli iletişim kur.</text><text x="54" y="356" fill="#94a3b8" font-size="19" font-weight="400">Bağlantını şifrenle doğrula.</text><rect x="604" y="242" width="560" height="139" rx="14" fill="#111e31"/><g data-feather="link" transform="translate(626 265) scale(1.1666666666666667)" stroke="#60a5fa" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g><text x="671" y="289" fill="#f8fafc" font-size="23" font-weight="650">Kolay kurulum</text><text x="626" y="328" fill="#cbd5e1" font-size="19" font-weight="400">JAR dosyasını plugins klasörüne ekle.</text><text x="626" y="356" fill="#94a3b8" font-size="19" font-weight="400">Ayarlarını düzenle ve sunucunu başlat.</text></g></svg>